<text x="52" y="119" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800">Abhishek Salian</text>
<line x1="54" y1="137" x2="690" y2="137" stroke="#ffffff" stroke-opacity=".7" stroke-width="2"/>
