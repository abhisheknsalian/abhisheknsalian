</g>

<!-- Berlin TV tower -->
<g filter="url(#shadow)">
  <path d="M886 238 L908 238 L906 132 L888 132 Z" fill="#0b1427"/>
  <ellipse cx="897" cy="112" rx="30" ry="14" fill="#d8dbe4"/>
  <path d="M897 98 L897 42" stroke="#d8dbe4" stroke-width="7"/>
  <path d="M897 42 L897 25" stroke="#d8dbe4" stroke-width="3"/>
</g>

<!-- skyline glow -->
<g fill="#e9c98b" opacity=".35">
  <rect x="55" y="255" width="5" height="12"/><rect x="76" y="250" width="5" height="16"/>
