<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#102b4e"/>
    <stop offset=".55" stop-color="#263b63"/>
    <stop offset="1" stop-color="#5b4b87"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#172d50" stop-opacity=".15"/>
    <stop offset="1" stop-color="#0b1730" stop-opacity=".8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect width="1200" height="300" rx="18" fill="url(#sky)"/>

<!-- subtle skyline -->
<g fill="#0c1930" opacity=".86">
